spring.application.name=gymflow

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gymflow_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=80MB
gymflow.upload-dir=${GYMFLOW_UPLOAD_DIR:uploads}

# Usa secretos distintos, aleatorios y de al menos 32 caracteres en cada entorno.
gymflow.auth.secret=${GYMFLOW_AUTH_SECRET}
gymflow.invitation.secret=${GYMFLOW_INVITATION_SECRET}
gymflow.cors.allowed-origins=${GYMFLOW_CORS_ALLOWED_ORIGINS:http://localhost:8081}
